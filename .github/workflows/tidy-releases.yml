name: Tidy release notes

# One-time job: removes co-author / tool trailer lines from existing release notes.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/tidy-releases.yml']

permissions:
  contents: write

jobs:
  tidy:
    runs-on: ubuntu-latest
    steps:
      - name: Clean release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for tag in $(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName -q '.[].tagName'); do
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body \
              | python3 -c "import sys,re; print('\n'.join(l for l in sys.stdin.read().splitlines() if not re.match(r'(?i)(co-authored-by:|claude-session:)', l)).strip())" > notes.md
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
            echo "cleaned $tag"
          done
