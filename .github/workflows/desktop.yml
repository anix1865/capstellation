name: Desktop app

# Builds Capstellation for macOS (.dmg, Apple Silicon + Intel) and Windows (installer).
# Download the results from the run's "Artifacts" section.
on:
  push:
    branches: [main]
    paths: ['index.html', 'controls.html', 'audiotap.swift', 'desktop/**', 'native/**']
  workflow_dispatch: {}

# Every build is published as a GitHub Release (v0.1.<run number>); the app checks it on launch.
permissions:
  contents: write

env:
  APP_VERSION: 0.1.${{ github.run_number }}

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build the system-audio tap (universal)
        run: |
          mkdir -p desktop/native-bin/mac build
          swiftc -O -target arm64-apple-macos13  audiotap.swift -o build/audiotap-arm64
          swiftc -O -target x86_64-apple-macos13 audiotap.swift -o build/audiotap-x64
          lipo -create build/audiotap-arm64 build/audiotap-x64 -output desktop/native-bin/mac/audiotap
          codesign --force --sign - desktop/native-bin/mac/audiotap
          lipo -info desktop/native-bin/mac/audiotap

      - uses: actions/setup-node@v7
        with: { node-version: 20 }

      - name: Install
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version

      - name: Package
        working-directory: desktop
        env: { CSC_IDENTITY_AUTO_DISCOVERY: 'false' }
        run: npx electron-builder --mac --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Capstellation-macOS
          path: desktop/dist/*.dmg
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with: { dotnet-version: '8.0.x' }

      - name: Build the Windows helper
        run: dotnet publish native/windows -c Release -o desktop/native-bin/win

      - uses: actions/setup-node@v7
        with: { node-version: 20 }

      - name: Install
        working-directory: desktop
        run: |
          npm install --no-audit --no-fund
          npm version ${{ env.APP_VERSION }} --no-git-tag-version --allow-same-version

      - name: Package
        working-directory: desktop
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v7
        with:
          name: Capstellation-Windows
          path: desktop/dist/*.exe
          if-no-files-found: error

  release:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist, merge-multiple: true }

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.head_commit.message }}
        run: |
          ls -la dist
          # release notes = the commit message, without any co-author / tool trailer lines
          printf '%s\n' "${NOTES:-Manual build}" | grep -viE '^(co-authored-by:|[a-z-]+-session:)' > notes.md || true
          gh release create "v${APP_VERSION}" dist/* \
            --repo "${{ github.repository }}" \
            --title "Capstellation ${APP_VERSION}" \
            --notes-file notes.md \
            --target "${{ github.sha }}" \
            --latest
